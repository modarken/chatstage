name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code or steps that show the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ChatStage version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [WPF, WinForms, MAUI, Blazor Server, Blazor WebAssembly, Other]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: .NET SDK version (`dotnet --version`), OS, and the agent server you use.
